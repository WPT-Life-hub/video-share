<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>S3 实时积分榜 · WPT</title>
<style>
:root{
  --bg:#101416;
  --panel:#171d20;
  --panel-2:#1d2428;
  --line:#2b3438;
  --text:#eef3f1;
  --muted:#94a39e;
  --mint:#58d7b0;
  --amber:#f4b45f;
  --danger:#ef7a72;
  --rank-width:64px;
  --score-width:150px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;
}
button{font:inherit}
.shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:34px 0 42px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:0}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #3b4a46;border-radius:8px;color:var(--mint);font-size:13px}
.season{font-size:13px;color:var(--amber);border:1px solid #5a472d;padding:6px 10px;border-radius:999px;white-space:nowrap}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
.eyebrow{margin:0 0 8px;color:var(--mint);font-size:13px;font-weight:700}
h1{margin:0;font-size:42px;line-height:1.12;letter-spacing:0;font-weight:800}
.intro{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.7;max-width:620px}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap;padding-bottom:5px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(88,215,176,.12)}
.live.is-error .live-dot{background:var(--danger);box-shadow:0 0 0 4px rgba(239,122,114,.12)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.metric{padding:16px 20px 16px 0}
.metric + .metric{padding-left:20px;border-left:1px solid var(--line)}
.metric-label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.metric-value{font-size:19px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.board{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.board-head,.rank-row{display:grid;grid-template-columns:var(--rank-width) minmax(0,1fr) var(--score-width);align-items:center}
.board-head{padding:13px 20px;background:var(--panel-2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.board-head .score{text-align:right}
.rank-list{min-height:240px}
.rank-row{padding:14px 20px;border-bottom:1px solid rgba(43,52,56,.72);transition:background .16s ease}
.rank-row:last-child{border-bottom:0}
.rank-row:hover{background:rgba(255,255,255,.025)}
.rank{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.player{min-width:0}
.name{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{text-align:right;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.row-1 .rank,.row-1 .score{color:var(--amber)}
.row-2 .rank{color:#d8e1df}
.row-3 .rank{color:#c9976a}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:240px;padding:36px 20px;color:var(--muted)}
.state strong{display:block;color:var(--text);font-size:17px;margin-bottom:8px}
.state p{margin:0;max-width:460px;line-height:1.7;font-size:14px}
.retry{margin-top:16px;background:transparent;color:var(--mint);border:1px solid #38574f;border-radius:8px;padding:8px 14px;cursor:pointer}
.retry:hover{background:rgba(88,215,176,.08)}
.note{display:flex;justify-content:space-between;gap:20px;margin-top:15px;color:var(--muted);font-size:12px;line-height:1.65}
.skeleton{height:16px;border-radius:4px;background:#253035;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (max-width:700px){
  :root{--rank-width:42px;--score-width:92px}
  .shell{width:min(100% - 22px,1040px);padding:22px 0 30px}
  .topbar{margin-bottom:24px}
  .hero{display:block;margin-bottom:20px}
  h1{font-size:31px}
  .intro{font-size:14px}
  .live{margin-top:15px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{padding:13px 12px 13px 0}
  .metric + .metric{padding-left:12px}
  .metric:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding-left:0}
  .board-head,.rank-row{padding-left:13px;padding-right:13px}
  .rank-row{padding-top:13px;padding-bottom:13px}
  .name{font-size:15px}
  .score{font-size:18px}
  .sub{max-width:100%}
  .note{display:block}
  .note span{display:block;margin-top:5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">WPT</span><span>观看有奖</span></div>
    <div class="season" id="season-badge">S3 · 休整赛季</div>
  </div>

  <section class="hero" aria-labelledby="page-title">
    <div>
      <p class="eyebrow" id="hero-eyebrow">DAILY LIVE RANKING</p>
      <h1 id="page-title">S3 实时积分榜</h1>
      <p class="intro" id="hero-intro">每日互动积分实时更新。S3 休整赛季暂停周榜，当前页面只展示当天有效积分。</p>
    </div>
    <div class="live" id="live-state"><span class="live-dot"></span><span id="live-text">正在连接</span></div>
  </section>

  <section class="metrics" aria-label="排行榜概况">
    <div class="metric"><span class="metric-label">统计日期</span><span class="metric-value" id="day-value">--</span></div>
    <div class="metric"><span class="metric-label">上榜人数</span><span class="metric-value" id="players-value">--</span></div>
    <div class="metric"><span class="metric-label">最后更新</span><span class="metric-value" id="updated-value">--</span></div>
  </section>

  <section class="board" aria-label="实时积分排名">
    <div class="board-head"><span>名次</span><span>观众</span><span class="score">积分</span></div>
    <div class="rank-list" id="rank-list" aria-live="polite">
      <div class="state"><strong>正在读取排行榜</strong><p>首次加载通常只需要几秒。</p></div>
    </div>
  </section>

  <div class="note">
    <span>每 15 秒自动刷新 · 只显示公开昵称与积分</span>
    <span id="source-note">数据来自 WPT 实时积分系统</span>
  </div>
</main>

<script>
(() => {
  const CONFIG_URLS = [
    new URL('../rank-config.json', location.href).href,
    'https://raw.githubusercontent.com/WPT-Life-hub/video-share/main/rank-config.json'
  ];
  const SNAPSHOT_URLS = [
    new URL('../rank-data.json', location.href).href,
    'https://raw.githubusercontent.com/WPT-Life-hub/video-share/main/rank-data.json'
  ];
  function fetchWithTimeout(url, ms) {
    const opt = {cache: 'no-store'};
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
      opt.signal = AbortSignal.timeout(ms || 8000);
    }
    return fetch(url, opt);
  }
  const REFRESH_MS = 15000;
  const params = new URLSearchParams(location.search);
  const requestedDay = params.get('day') || '';
  const forceSnapshot = params.get('source') === 'snapshot';
  const list = document.getElementById('rank-list');
  const liveState = document.getElementById('live-state');
  const liveText = document.getElementById('live-text');
  const dayValue = document.getElementById('day-value');
  const playersValue = document.getElementById('players-value');
  const updatedValue = document.getElementById('updated-value');
  const sourceNote = document.getElementById('source-note');
  const seasonBadge = document.getElementById('season-badge');
  const heroEyebrow = document.getElementById('hero-eyebrow');
  const pageTitle = document.getElementById('page-title');
  const heroIntro = document.getElementById('hero-intro');
  let apiBase = '';
  let loading = false;

  const fmtScore = new Intl.NumberFormat('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});

  function seasonView(season) {
    const value = String(season || 'S3').toUpperCase();
    if (value === 'S3') {
      return {
        badge: 'S3 · 休整赛季',
        eyebrow: 'DAILY LIVE RANKING',
        title: 'S3 实时积分榜',
        intro: '每日互动积分实时更新。S3 休整赛季暂停周榜，当前页面只展示当天有效积分。',
        empty: '开播并开始统计后，排行榜会自动出现。S3 只计算当天积分，不展示周榜。'
      };
    }
    if (value === 'S2') {
      return {
        badge: 'S2 · 历史积分',
        eyebrow: 'DAILY RANKING HISTORY',
        title: 'S2 每日积分榜',
        intro: '该日期属于 S2 赛季历史数据，展示当天有效互动积分。',
        empty: '该日期没有可展示的上榜记录。'
      };
    }
    return {
      badge: `${value} · 历史积分`,
      eyebrow: 'DAILY RANKING HISTORY',
      title: `${value} 每日积分榜`,
      intro: '展示该日期保存的有效互动积分。',
      empty: '该日期没有可展示的上榜记录。'
    };
  }

  function applySeason(season) {
    const view = seasonView(season);
    seasonBadge.textContent = view.badge;
    heroEyebrow.textContent = view.eyebrow;
    pageTitle.textContent = view.title;
    heroIntro.textContent = view.intro;
    document.title = `${view.title} · WPT`;
    return view;
  }

  function setLive(ok, text) {
    liveState.classList.toggle('is-error', !ok);
    liveText.textContent = text;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
  }

  function renderState(title, text, retry = false) {
    list.innerHTML = `<div class="state"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(text)}</p>${retry ? '<button class="retry" id="retry-btn">立即重试</button>' : ''}</div>`;
    if (retry) document.getElementById('retry-btn').addEventListener('click', refresh);
  }

  function renderRows(rows, view) {
    if (!rows.length) {
      const title = requestedDay ? '该日期还没有上榜记录' : '今天还没有上榜记录';
      list.innerHTML = `<div class="state"><strong>${title}</strong><p>${view.empty}</p></div>`;
      return;
    }
    list.innerHTML = rows.map(row => {
      const sub = `在场 ${Number(row.presence_min || 0).toFixed(1)} 分钟 · 出声 ${Number(row.speaking_min || 0)} 分钟`;
      return `<div class="rank-row row-${row.rank <= 3 ? row.rank : 'normal'}">
        <span class="rank">${String(row.rank).padStart(2, '0')}</span>
        <span class="player"><span class="name">${escapeHtml(row.nickname)}</span><span class="sub">${escapeHtml(sub)}</span></span>
        <span class="score">${fmtScore.format(Number(row.score || 0))}</span>
      </div>`;
    }).join('');
  }

  async function loadConfig() {
    if (apiBase) return apiBase;
    let lastError = null;
    for (const url of CONFIG_URLS) {
      try {
        const res = await fetchWithTimeout(`${url}?t=${Date.now()}`, 6000);
        if (!res.ok) throw new Error(`配置文件加载失败（${res.status}）`);
        const cfg = await res.json();
        apiBase = String(cfg.api_base || '').trim().replace(/\/+$/, '');
        if (!apiBase) throw new Error('实时数据接口正在配置');
        return apiBase;
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error('配置文件加载失败');
  }

  async function loadSnapshot() {
    let lastError = null;
    for (const url of SNAPSHOT_URLS) {
      try {
        const res = await fetchWithTimeout(`${url}?v=${Date.now()}`, 8000);
        if (!res.ok) throw new Error(`稳定快照加载失败（${res.status}）`);
        const data = await res.json();
        if (!data.ok || !Array.isArray(data.rows)) throw new Error('稳定快照内容异常');
        if (requestedDay && data.day !== requestedDay) throw new Error('稳定快照不含该历史日期');
        return data;
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error('稳定快照加载失败');
  }

  async function refresh() {
    if (loading) return;
    loading = true;
    setLive(true, '正在刷新');
    try {
      const base = forceSnapshot ? await Promise.reject(new Error('已切换到稳定快照')) : await loadConfig();
      const dayQuery = requestedDay ? `&day=${encodeURIComponent(requestedDay)}` : '';
      const res = await fetchWithTimeout(`${base}/api/rank?t=${Date.now()}${dayQuery}`, 6000);
      if (!res.ok) throw new Error(`接口返回 ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '接口返回异常');

      const view = applySeason(data.season);
      dayValue.textContent = data.day || '--';
      playersValue.textContent = Number(data.total_players || 0);
      updatedValue.textContent = String(data.generated_at || '--').slice(11) || '--';
      sourceNote.textContent = requestedDay
        ? '历史日期查询 · 只显示公开昵称与积分'
        : `每 ${Number(data.refresh_sec || 15)} 秒更新 · 只显示公开昵称与积分`;
      renderRows(Array.isArray(data.rows) ? data.rows : [], view);
      setLive(true, data.status === 'waiting' ? '等待开播' : (requestedDay ? '历史榜单' : '实时更新中'));
    } catch (err) {
      apiBase = '';
      try {
        const snapshot = await loadSnapshot();
        const view = applySeason(snapshot.season);
        dayValue.textContent = snapshot.day || '--';
        playersValue.textContent = Number(snapshot.total_players || 0);
        const published = String(snapshot._published_at || snapshot.generated_at || '--');
        updatedValue.textContent = published.slice(11) || '--';
        sourceNote.textContent = requestedDay
          ? '实时通道暂不可用 · 显示稳定历史快照'
          : '实时通道暂不可用 · 显示最近成功快照';
        renderRows(snapshot.rows, view);
        setLive(true, `稳定快照 ${published.slice(11, 19) || ''}`.trim());
      } catch (snapshotErr) {
        setLive(false, '连接中断');
        renderState('暂时无法读取排行榜', `${err.message || err}；${snapshotErr.message || snapshotErr}。页面会自动重试，已分享的网址不会变化。`, true);
      }
    } finally {
      loading = false;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh();
  });
})();
</script>
</body>
</html>
